services:
  # 1. FastAPI Web Backend (runs both API and in-memory background loop for free!)
  - type: web
    name: kavach-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString
      - key: ENV
        value: production
      - key: PAPER_MODE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ANGELONE_CLIENT_CODE
        sync: false
      - key: ANGELONE_PASSWORD
        sync: false
      - key: ANGELONE_TOTP_SECRET
        sync: false
      - key: ANGELONE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

# 2. PostgreSQL Database (stores logs & configuration)
databases:
  - name: kavach-db
    plan: free
